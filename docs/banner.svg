<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Horus — a calibrated red-team harness for LLM applications">
  <defs>
    <radialGradient id="ground" cx="0.28" cy="0.5" r="0.8">
      <stop offset="0%"   stop-color="#102741"/>
      <stop offset="45%"  stop-color="#081426"/>
      <stop offset="100%" stop-color="#03060C"/>
    </radialGradient>

    <!-- A faint pool of light behind the mark. Depth, not decoration: it is
         what stops a flat dark field reading as merely empty. -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#E8C46A" stop-opacity="0.13"/>
      <stop offset="60%"  stop-color="#C9962E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#C9962E" stop-opacity="0"/>
    </radialGradient>

    <!-- Polished metal, not flat yellow: the banding is what reads as gold.
         userSpaceOnUse is mandatory — an objectBoundingBox gradient silently
         fails to render on any perfectly straight path (zero-area bbox). -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="340">
      <stop offset="0%"   stop-color="#9A7024"/>
      <stop offset="22%"  stop-color="#F2D98A"/>
      <stop offset="45%"  stop-color="#C9962E"/>
      <stop offset="72%"  stop-color="#FFF3C8"/>
      <stop offset="100%" stop-color="#8E661F"/>
    </linearGradient>

    <linearGradient id="goldFaint" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%"   stop-color="#C9962E" stop-opacity="0.08"/>
      <stop offset="50%"  stop-color="#F2D98A" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#C9962E" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#ground)"/>
  <circle cx="290" cy="200" r="250" fill="url(#halo)"/>

  <!-- Double hairline. Restraint is the luxury cue; precision, not ornament. -->
  <rect x="16" y="16" width="1168" height="368" fill="none"
        stroke="url(#goldFaint)" stroke-width="1.2"/>
  <rect x="22" y="22" width="1156" height="356" fill="none"
        stroke="url(#goldFaint)" stroke-width="0.5" opacity="0.55"/>

  <!-- ===================== The wedjat =====================
       Two weights, deliberately: the contour carries the form, the finer
       marks carry the detail. A single weight is clean; a considered
       hierarchy is refined. -->
  <g transform="translate(126,69) scale(1.32)" fill="none" stroke="url(#gold)"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- brow -->
    <path d="M26,40 C70,6 150,2 196,26" stroke-width="12.5"/>
    <!-- fine line paralleling the brow: the incised band of Egyptian relief -->
    <path d="M36,54 C74,26 144,22 186,42" stroke-width="3.4" opacity="0.7"/>

    <!-- eye -->
    <path d="M14,86 C56,44 148,42 200,72 C150,112 58,116 14,86 Z" stroke-width="12.5"/>
    <circle cx="108" cy="78" r="19" fill="url(#gold)" stroke="none"/>
    <!-- upper lid accent -->
    <path d="M40,80 C70,58 130,56 172,70" stroke-width="3" opacity="0.5"/>

    <!-- malar stripe and spiral tail -->
    <path d="M84,106 L66,168" stroke-width="12.5"/>
    <path d="M138,104 C154,140 178,150 166,172 C154,192 122,186 124,164"
          stroke-width="12.5"/>
  </g>

  <!-- ===================== Wordmark ===================== -->
  <g transform="translate(494,110) scale(0.94)" fill="none" stroke="url(#gold)"
     stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <g><path d="M0,0 L0,104"/><path d="M70,0 L70,104"/><path d="M0,52 L70,52"/></g>
    <g transform="translate(117,0)">
      <path d="M0,30 C0,10 18,0 39,0 C60,0 78,10 78,30 L78,74
               C78,94 60,104 39,104 C18,104 0,94 0,74 Z"/>
    </g>
    <g transform="translate(240,0)">
      <path d="M0,0 L0,104"/>
      <path d="M0,0 L44,0 C68,0 68,52 44,52 L0,52"/>
      <path d="M40,52 L74,104"/>
    </g>
    <g transform="translate(356,0)">
      <path d="M0,0 L0,70 C0,92 17,104 38,104 C59,104 76,92 76,70 L76,0"/>
    </g>
    <g transform="translate(473,0)">
      <path d="M72,20 C64,6 44,-2 26,4 C4,12 0,38 22,48
               C46,58 74,64 74,84 C74,100 52,110 32,104 C18,100 8,92 4,82"/>
    </g>
  </g>

  <g transform="translate(496,252)">
    <path d="M0,0 L92,0" stroke="#C9962E" stroke-width="2.2" stroke-linecap="round"/>
    <text x="0" y="42" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="19" letter-spacing="2.1" fill="#E8DFC8">
      A calibrated red-team harness for LLM applications
    </text>
    <text x="0" y="76" font-family="DejaVu Sans Mono, monospace"
          font-size="13.5" letter-spacing="3.6" fill="#6B8FC4">
      THE EYE THAT MEASURES ITS OWN SIGHT
    </text>
  </g>
</svg>
