# =============================================================================
# Horus run configuration (annotated reference).
#
# A run is fully described by this file so it is version-controllable and
# reproducible. Copy it, point `target` at a system you are AUTHORISED to test,
# and run:  horus run --config config/my.config.yaml
# =============================================================================

# --- Target under test -------------------------------------------------------
# The built-in mock needs no keys and is great for trying the tool out.
target:
  kind: mock            # mock | openai_compat | http
  leak_probability: 0.25

# Example: an OpenAI-compatible endpoint (also works for many local servers).
# target:
#   kind: openai_compat
#   base_url: https://api.openai.com/v1
#   model: gpt-4o-mini-2024-07-18     # use a DATED snapshot for reproducibility
#   api_key_env: OPENAI_API_KEY       # read from env, never hard-code secrets
#   temperature: 0.0

# Example: an agentic target (has tools). Requires `tool_policy` below, or the
# action trace cannot be judged and Horus will warn you.
# target:
#   kind: mock_agent

# Example: an infrastructure agent in your homelab (shell / files / network).
# Requires `tool_policy` AND `scope` — the run refuses to start out of scope.
# target:
#   kind: infra_agent
#   endpoint: http://app.lab.internal:8080/v1/message
#   scope: config/scope.example.yaml
#   response_path: choices.0.message.content
#   tool_calls_path: choices.0.message.tool_calls

# Example: an arbitrary chatbot behind HTTP.
# target:
#   kind: http
#   endpoint: https://chat.internal.example.com/v1/message
#   model: support-bot-2025-06
#   headers: { Authorization: "${SUPPORT_BOT_TOKEN}" }
#   body_template: { stream: false }
#   messages_field: messages
#   response_path: data.reply.text        # dotted path to the reply text
#   tool_calls_path: data.reply.actions   # dotted path to the tool-call array;
#                                         # required for agentic targets, or the
#                                         # trace judge silently has nothing to judge
#   max_rate_per_min: 60                  # client-side throttle, stay inside quota
#   pricing:                              # WITHOUT THIS, budget_usd IS INERT
#     input_per_1m: 3.00                  # USD per 1M prompt tokens
#     output_per_1m: 15.00                # USD per 1M completion tokens

# --- Probe packs -------------------------------------------------------------
# Shipped packs can be referenced by filename; your own by full path.
packs:
  - examples.yaml
  - benign_baseline.yaml
  # - agentic.yaml                 # tool-abuse probes; needs tool_policy below
  # - /path/to/your/authored/pack.yaml

# --- Tool policy (agentic targets only) --------------------------------------
# Declares what authority the agent actually has. Action traces are judged
# against this; without it, tool_abuse probes fall back to text-only scoring.
# tool_policy: config/tool_policy.example.yaml
# scope: config/scope.example.yaml       # REQUIRED for infra_agent targets

# --- Judge -------------------------------------------------------------------
judge:
  kind: ensemble          # deterministic | llm | ensemble (recommended)
  review_low: 0.35        # verdicts in [low, high] confidence are flagged
  review_high: 0.65       # for human review and feed the gold set
  # Use a DIFFERENT model/provider for the judge than the target under test,
  # to avoid shared blind spots. Here we use the offline heuristic judge so the
  # demo needs no keys; swap it for a real model in a real assessment.
  judge_target:
    kind: mock_judge
  # judge_target:
  #   kind: openai_compat
  #   base_url: https://api.anthropic.com/v1   # e.g. a different provider
  #   model: some-judge-model-snapshot
  #   api_key_env: JUDGE_API_KEY

# --- Execution ---------------------------------------------------------------
repeats: 8                # each probe is run N times; we report success RATES
concurrency: 1            # parallel workers. Raise for real runs; findings are
                          # identical either way (results are re-sorted), but
                          # keep it under the provider's rate limit.
budget_usd: 5.0           # hard cap; the run stops if exceeded.
                          # Requires `pricing:` on the target — run
                          # `horus check` and it will tell you if the cap is inert.

# CI gate: exit code 2 if any finding reaches this severity. Leave unset for
# assessment runs; set it when Horus runs in a pipeline.
# fail_on: high
threat_model_id: tm-support-bot-v1   # ties the run to a threat model doc
db_path: horus.db
out_html: horus_report.html
